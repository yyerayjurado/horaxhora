services:
  # * PHP + Apache
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: sistema_trueque
      DB_USER: usuario
      DB_PASS: usuario
      # ! Dentro de Docker, MailHog se llama "mailhog" (el nombre del servicio), no localhost
      MAIL_HOST: mailhog
    depends_on:
      - db

  # * MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_trueque
      MYSQL_USER: usuario
      MYSQL_PASSWORD: usuario
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

  # * MailHog: 1025 = SMTP (donde PHP envía), 8025 = bandeja web
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
